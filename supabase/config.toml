
[functions.generate-story]
enabled = true
verify_jwt = false
import_map = "./functions/generate-story/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/generate-story/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/generate-story/*.html" ]

[functions.delete-account]
enabled = true
# Gateway verifies the caller's JWT before the
# function runs; the function itself re-checks
# the user via admin.auth.getUser().
verify_jwt = true
