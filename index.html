<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- viewport-fit=cover exposes safe-area insets
         for notched phones; user-scalable=no makes it
         feel like a native app, not a web page. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta name="theme-color" content="#ff5c8d" />

    <!-- Windows tile -->
    <meta name="msapplication-TileColor" content="#14100f" />

    <!-- Installed-to-homescreen app behavior -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Momentry" />

    <title>Momentry — Every memory deserves its own chapter</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Momentry turns your photos, dates and places into beautiful collaborative stories and keepsake StoryBooks. Preserve and relive your most meaningful memories."
    />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Momentry" />
    <meta property="og:title" content="Momentry — Every memory deserves its own chapter" />
    <meta
      property="og:description"
      content="Turn your photos, dates and places into beautiful collaborative stories. Preserve and relive your most meaningful memories."
    />
    <meta property="og:url" content="https://momentry.app/" />
    <meta property="og:image" content="https://momentry.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Momentry — Every memory deserves its own chapter" />
    <meta
      name="twitter:description"
      content="Turn your photos, dates and places into beautiful collaborative stories."
    />
    <meta name="twitter:image" content="https://momentry.app/og-image.png" />

    <!-- Fonts: Cormorant Garamond (display serif) + Inter (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
